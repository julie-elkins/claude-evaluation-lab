name: Learner feedback
description: Share public feedback about the course or a learner lab.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the course.

        This form creates a public GitHub issue. Do not include your name,
        contact information, personal data, confidential work information,
        private learner conversations, unpublished exam material, provider
        payloads, API keys, or private prompts.

        For a private response, do not put an email address in this issue.
        Use the public contact method listed on Julie's website instead.

  - type: dropdown
    id: feedback-area
    attributes:
      label: What are you giving feedback about?
      options:
        - Course guide or lesson
        - Runnable lab
        - Optional provider extension
        - Accessibility or format
        - Documentation or link
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Lesson or lab path
      description: Name the lesson, lab, or file if you can identify it.
      placeholder: "labs/01-semantic-outcomes"

  - type: textarea
    id: what-worked
    attributes:
      label: What worked?
      description: Which explanation, command, example, or evidence boundary helped?
      placeholder: "The degraded example made the difference between transport and task success clear."

  - type: textarea
    id: what-was-unclear
    attributes:
      label: What was unclear or difficult?
      description: Describe the point where you needed more explanation or support.

  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and format
      description: What helped you participate, and what made participation harder?

  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested change
      description: What is the smallest change that would improve the learner experience?

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included personal, confidential, private learner, exam, provider, credential, or secret information.
          required: true
